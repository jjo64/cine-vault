services:
  redis:
    image: redis:7-alpine
    container_name: cinevault-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Error, Debes configurar REDIS_PASSWORD en tu archivo .env}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Error, Debes configurar REDIS_PASSWORD en tu archivo .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data: