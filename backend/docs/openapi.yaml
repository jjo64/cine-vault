openapi: 3.1.0
info:
  title: API CineVault
  description: Documentación oficial de la API de CineVault. Red social para amantes del cine.
  version: 1.0.0
  contact:
    name: Equipo CineVault

servers:
  - url: https://api.cinevault.art/api
    description: Servidor de Producción
  - url: http://localhost:4000/api
    description: Servidor de desarrollo

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token

  schemas:
    UsuarioPublico:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor, user] }
        avatar_url: { type: string, format: uri, nullable: true }
        bio: { type: string, maxLength: 160, nullable: true }
        is_verified: { type: boolean }
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
    TwoFARequired:
      type: object
      properties:
        two_factor_required: { type: boolean, example: true }
        tokenTemporal: { type: string }
    MensajeResponse:
      type: object
      properties:
        message: { type: string }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        code: { type: integer }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    ChangePasswordRequest:
      type: object
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual: { type: string }
        contrasenaNueva: { type: string }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }

  responses:
    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registro exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  userId: { type: integer }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Usuario ya existe

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK. Devuelve AccessToken y setea cookie refresh.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/TwoFARequired'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar access token usando refresh en cookie
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión y revocar refresh actual
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'

  /auth/verify:
    get:
      tags: [Autenticación]
      summary: Verificar token de acceso actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPublico'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email/{token}:
    post:
      tags: [Autenticación]
      summary: Confirmar correo electrónico
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Email verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '410':
          description: Enlace expirado

  /auth/resend-verification:
    post:
      tags: [Autenticación]
      summary: Reenviar email de verificación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Email reenviado si aplica

  /auth/forgot-password:
    post:
      tags: [Autenticación]
      summary: Solicitar correo de reseteo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Correo enviado si aplica

  /auth/reset-password:
    post:
      tags: [Autenticación]
      summary: Resetear contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada

  /auth/cambiar-contrasena:
    post:
      tags: [Autenticación]
      summary: Cambiar contraseña autenticado
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada

  /auth/revocar-sesiones:
    post:
      tags: [Autenticación]
      summary: Revocar todas las sesiones del usuario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesiones revocadas

  /auth/2fa/activar:
    post:
      tags: [Autenticación]
      summary: Generar QR y secreto para 2FA
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Devuelve QR (dataURL) y secreto base32

  /auth/2fa/confirmar:
    post:
      tags: [Autenticación]
      summary: Confirmar código de 2FA tras escanear
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string }
      responses:
        '200':
          description: 2FA activado

  /auth/2fa/verificar:
    post:
      tags: [Autenticación]
      summary: Paso 2 de login (2FA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, tokenTemporal]
              properties:
                codigo: { type: string }
                tokenTemporal: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/2fa/desactivar:
    post:
      tags: [Autenticación]
      summary: Desactivar 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string }
      responses:
        '200':
          description: 2FA desactivado
